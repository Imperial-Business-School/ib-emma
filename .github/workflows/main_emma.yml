# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - emma

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: npm install and build
        env:
          # next.config.js bakes this into the bundle so the running app can
          # report which commit it is on. Vercel set this for us; Actions
          # does not.
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      # Drop typescript/tailwind/postcss etc. They are needed for the build
      # above but not by `next start`, and they roughly triple the artifact.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      # Zip rather than uploading the tree directly: upload-artifact skips
      # hidden files (which would silently drop .next), and the artifact
      # round-trip does not preserve the executable bit on node_modules/.bin,
      # which is what made the container exit 127 on startup.
      - name: Zip artifact for deployment
        run: zip -ry release.zip . -x '.git/*' '.next/cache/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DB51E009F5144A9B98976D7CB44BA7C1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0B2C7387E35241D28AEBB42578A51683 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_45D3736677324E19BB613D427E8A878D }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'emma'
          slot-name: 'Production'
          package: release.zip
          # Invoke Next's real entry point rather than node_modules/.bin/next.
          # The .bin entry is a symlink whose relative requires only resolve
          # from its target, so it breaks if anything along the way turns it
          # back into a plain file.
          startup-command: 'node node_modules/next/dist/bin/next start'
